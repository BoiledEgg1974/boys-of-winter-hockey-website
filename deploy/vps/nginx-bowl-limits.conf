# Included from http {} via /etc/nginx/conf.d/bowl-limits.conf
# Protect gunicorn from crawler/statistics storms (504 upstream timeouts).

limit_req_zone $binary_remote_addr zone=bowl_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=bowl_stats:10m rate=1r/m;
limit_req_status 429;

# Site-wide caps (many crawler IPs bypass per-IP limits).
map $request_uri $bowl_stats_global_key {
    default "";
    ~^/bowl-(cap|fantasy|historical)/statistics "stats";
}
map $request_uri $bowl_player_global_key {
    default "";
    ~^/bowl-(cap|fantasy|historical)/player/ "player";
}
map $request_uri $bowl_records_global_key {
    default "";
    ~^/bowl-(cap|fantasy|historical)/records "records";
}

# Stats pages are slow (~30s+); keep well below gunicorn concurrency (6).
limit_req_zone $bowl_stats_global_key zone=bowl_stats_global:10m rate=6r/m;
limit_req_zone $bowl_player_global_key zone=bowl_player_global:10m rate=20r/m;
limit_req_zone $bowl_records_global_key zone=bowl_records_global:10m rate=12r/m;

map $http_user_agent $bowl_deny_bot {
    default 0;
    ~*PerplexityBot 1;
    ~*Reflectionbot 1;
    ~*meta-externalagent 1;
    ~*AhrefsBot 1;
    ~*SemrushBot 1;
    ~*DotBot 1;
    ~*MJ12bot 1;
    ~*BLEXBot 1;
}
