upstream bowl_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    server_name www.bowlhockey.com bowlhockey.com _;

    client_max_body_size 20M;

    include /etc/nginx/snippets/bowl-gzip.conf;
    include /etc/nginx/snippets/bowl-static.conf;
    include /etc/nginx/snippets/bowl-cloudflare.conf;

    if ($bowl_deny_bot) {
        return 403;
    }

    # Hub and auth stay responsive under crawler load.
    location = / {
        limit_conn bowl_app_conn 6;
        limit_req zone=bowl_scraper_ua burst=2 nodelay;
        limit_req zone=bowl_ip burst=40 nodelay;
        include /etc/nginx/snippets/bowl-proxy.conf;
    }

    location ^~ /login {
        limit_conn bowl_app_conn 6;
        limit_req zone=bowl_ip burst=40 nodelay;
        include /etc/nginx/snippets/bowl-proxy.conf;
    }

    # Storm kill switch: these pages pin gunicorn. Reopen after cache/cheap-path work.
    location ~ ^/bowl-(cap|fantasy|historical)/(statistics|records|free-agents|team-reports) {
        return 429;
    }

    location ~ ^/bowl-(cap|fantasy|historical)/player/ {
        limit_conn bowl_app_conn 6;
        limit_req zone=bowl_player_global burst=4 nodelay;
        limit_req zone=bowl_scraper_ua burst=2 nodelay;
        limit_req zone=bowl_ip burst=10 nodelay;
        include /etc/nginx/snippets/bowl-proxy.conf;
    }

    location ~ ^/bowl-(cap|fantasy|historical)/team/ {
        limit_conn bowl_app_conn 6;
        limit_conn bowl_heavy_conn 2;
        limit_req zone=bowl_team_global burst=2 nodelay;
        limit_req zone=bowl_scraper_ua burst=1 nodelay;
        limit_req zone=bowl_ip burst=8 nodelay;
        include /etc/nginx/snippets/bowl-proxy.conf;
    }

    location / {
        limit_conn bowl_app_conn 6;
        limit_req zone=bowl_scraper_ua burst=2 nodelay;
        limit_req zone=bowl_ip burst=20 nodelay;
        include /etc/nginx/snippets/bowl-proxy.conf;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.bowlhockey.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.bowlhockey.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = bowlhockey.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.bowlhockey.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.bowlhockey.com bowlhockey.com _;
    return 404; # managed by Certbot
}
