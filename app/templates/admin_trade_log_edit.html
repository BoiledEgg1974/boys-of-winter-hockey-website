{% extends "base.html" %}
{% block title %}Edit Trade Log Entry — {{ config.LEAGUE_DISPLAY_NAME }}{% endblock %}
{% block content %}
<div class="card" style="max-width:40rem;margin:0 auto;">
  <h1 class="page-title">Edit manual trade</h1>
  <p><a href="{{ url_for('site_admin.admin_trade_log') }}">← Manual trade log</a></p>
  <p class="muted">Use full player names when possible; the public Trade Log and admin list link matching players automatically.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div style="display:grid;gap:0.55rem;">
      <label>Trade date (optional)
        <input type="date" name="trade_date" value="{{ entry.trade_date.isoformat() if entry.trade_date else '' }}">
      </label>
      <label>Team A
        <span class="manual-trade-log__team-select">
        <select name="team_a_id" required data-logo-preview="manual-team-a-logo">
          {% if defunct_team_options %}
          <optgroup label="Defunct / historical teams">
            {% for opt in defunct_team_options %}
            <option value="{{ opt.value }}" data-logo-url="{{ opt.logo_url }}" {% if opt.value == selected_team_a_value %}selected{% endif %}>{{ opt.label }}</option>
            {% endfor %}
          </optgroup>
          {% endif %}
          <optgroup label="Active teams">
          {% for opt in active_team_options %}
          <option value="{{ opt.value }}" data-logo-url="{{ opt.logo_url }}" {% if opt.value == selected_team_a_value %}selected{% endif %}>{{ opt.label }}</option>
          {% endfor %}
          </optgroup>
        </select>
        <span class="manual-trade-log__logo-preview" aria-hidden="true"><img id="manual-team-a-logo" alt=""></span>
        </span>
      </label>
      <label>Team B
        <span class="manual-trade-log__team-select">
        <select name="team_b_id" required data-logo-preview="manual-team-b-logo">
          {% if defunct_team_options %}
          <optgroup label="Defunct / historical teams">
            {% for opt in defunct_team_options %}
            <option value="{{ opt.value }}" data-logo-url="{{ opt.logo_url }}" {% if opt.value == selected_team_b_value %}selected{% endif %}>{{ opt.label }}</option>
            {% endfor %}
          </optgroup>
          {% endif %}
          <optgroup label="Active teams">
          {% for opt in active_team_options %}
          <option value="{{ opt.value }}" data-logo-url="{{ opt.logo_url }}" {% if opt.value == selected_team_b_value %}selected{% endif %}>{{ opt.label }}</option>
          {% endfor %}
          </optgroup>
        </select>
        <span class="manual-trade-log__logo-preview" aria-hidden="true"><img id="manual-team-b-logo" alt=""></span>
        </span>
      </label>
      <label>Leaving Team A
        <textarea name="team_a_outgoing" rows="5" maxlength="4000" required placeholder="Players/picks leaving Team A…">{{ summary_parts[0] }}</textarea>
      </label>
      <label>Leaving Team B
        <textarea name="team_b_outgoing" rows="5" maxlength="4000" required placeholder="Players/picks leaving Team B…">{{ summary_parts[1] }}</textarea>
      </label>
      <div>
        <button type="submit" class="join-league-btn">Save</button>
      </div>
    </div>
  </form>
</div>
<script>
(function () {
  function updateLogo(select) {
    var img = document.getElementById(select.getAttribute('data-logo-preview') || '');
    if (!img) return;
    var opt = select.options[select.selectedIndex];
    var url = opt ? opt.getAttribute('data-logo-url') : '';
    img.src = url || '';
    img.style.display = url ? '' : 'none';
  }
  document.querySelectorAll('select[data-logo-preview]').forEach(function (select) {
    select.addEventListener('change', function () { updateLogo(select); });
    updateLogo(select);
  });
})();
</script>
{% endblock %}
