# Avoid sending crawler probes through gunicorn (404s were saturating workers).
location = /robots.txt {
    alias /srv/bowl/app/app/static/robots.txt;
    default_type text/plain;
    access_log off;
}

# League-prefixed static (files live under app/static/, not under bowl-fantasy/ on disk).
location ~ ^/(?:bowl-historical|bowl-fantasy|bowl-cap|bowl-formula|bowl-demolition)/static/(.+)$ {
    alias /srv/bowl/app/app/static/$1;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}

# Hub / shared static at site root (if used).
location /static/ {
    alias /srv/bowl/app/app/static/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}

# Perfect Squad: prefix ^~ beats regex and never inherits location / rate limits.
# Longest prefix wins, so /static/ /bowl-media/ /action-shots/ stay on disk.
# Remaining /perfect-squad/ (admin HTML, front-photo.jpg) proxies with no bowl_ip cap.
location ^~ /bowl-historical/perfect-squad/static/ {
    alias /srv/bowl/perfect-squad/app/static/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}
location ^~ /bowl-fantasy/perfect-squad/static/ {
    alias /srv/bowl/perfect-squad/app/static/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}
location ^~ /bowl-cap/perfect-squad/static/ {
    alias /srv/bowl/perfect-squad/app/static/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}

location ^~ /bowl-historical/perfect-squad/bowl-media/ {
    alias /srv/bowl/app/app/static/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}
location ^~ /bowl-fantasy/perfect-squad/bowl-media/ {
    alias /srv/bowl/app/app/static/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}
location ^~ /bowl-cap/perfect-squad/bowl-media/ {
    alias /srv/bowl/app/app/static/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}

location ^~ /bowl-historical/perfect-squad/action-shots/ {
    alias /srv/bowl/perfect-squad/instance/action-shots/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}
location ^~ /bowl-fantasy/perfect-squad/action-shots/ {
    alias /srv/bowl/perfect-squad/instance/action-shots/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}
location ^~ /bowl-cap/perfect-squad/action-shots/ {
    alias /srv/bowl/perfect-squad/instance/action-shots/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}

location ^~ /bowl-historical/perfect-squad/ {
    include /etc/nginx/snippets/bowl-proxy.conf;
}
location ^~ /bowl-fantasy/perfect-squad/ {
    include /etc/nginx/snippets/bowl-proxy.conf;
}
location ^~ /bowl-cap/perfect-squad/ {
    include /etc/nginx/snippets/bowl-proxy.conf;
}
