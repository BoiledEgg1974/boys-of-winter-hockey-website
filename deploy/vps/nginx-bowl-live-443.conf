upstream bowl_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    server_name www.bowlhockey.com bowlhockey.com _;

    client_max_body_size 20M;

    include /etc/nginx/snippets/bowl-gzip.conf;
    include /etc/nginx/snippets/bowl-static.conf;

    location / {
        proxy_pass http://bowl_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.bowlhockey.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.bowlhockey.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = bowlhockey.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.bowlhockey.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.bowlhockey.com bowlhockey.com _;
    return 404; # managed by Certbot
}
