upstream bowl_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    server_name www.bowlhockey.com bowlhockey.com _;

    client_max_body_size 20M;

    include /etc/nginx/snippets/bowl-gzip.conf;
    include /etc/nginx/snippets/bowl-static.conf;

    if ($bowl_deny_bot) {
        return 403;
    }

    # Hub and auth stay responsive under crawler load.
    location = / {
        limit_req zone=bowl_ip burst=60 nodelay;
        include /etc/nginx/snippets/bowl-proxy.conf;
    }

    location ^~ /login {
        limit_req zone=bowl_ip burst=60 nodelay;
        include /etc/nginx/snippets/bowl-proxy.conf;
    }

    location ~ ^/bowl-(cap|fantasy|historical)/statistics {
        limit_req zone=bowl_stats_global burst=2 nodelay;
        limit_req zone=bowl_stats burst=1 nodelay;
        limit_req zone=bowl_ip burst=10 nodelay;
        include /etc/nginx/snippets/bowl-proxy.conf;
    }

    location ~ ^/bowl-(cap|fantasy|historical)/player/ {
        limit_req zone=bowl_player_global burst=12 nodelay;
        limit_req zone=bowl_ip burst=15 nodelay;
        include /etc/nginx/snippets/bowl-proxy.conf;
    }

    location ~ ^/bowl-(cap|fantasy|historical)/records {
        limit_req zone=bowl_records_global burst=8 nodelay;
        limit_req zone=bowl_ip burst=15 nodelay;
        include /etc/nginx/snippets/bowl-proxy.conf;
    }

    location / {
        limit_req zone=bowl_ip burst=25 nodelay;
        include /etc/nginx/snippets/bowl-proxy.conf;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.bowlhockey.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.bowlhockey.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = bowlhockey.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.bowlhockey.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.bowlhockey.com bowlhockey.com _;
    return 404; # managed by Certbot
}
