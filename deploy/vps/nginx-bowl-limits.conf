# Included from http {} via /etc/nginx/conf.d/bowl-limits.conf
# Protect gunicorn from crawler/statistics storms (504 upstream timeouts).

limit_req_zone $binary_remote_addr zone=bowl_ip:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=bowl_stats:10m rate=1r/m;
limit_req_status 429;

# Site-wide caps (many crawler IPs bypass per-IP limits).
map $request_uri $bowl_stats_global_key {
    default "";
    ~^/bowl-(cap|fantasy|historical)/statistics "stats";
}
map $request_uri $bowl_player_global_key {
    default "";
    ~^/bowl-(cap|fantasy|historical)/player/ "player";
}
map $request_uri $bowl_records_global_key {
    default "";
    ~^/bowl-(cap|fantasy|historical)/records "records";
}
map $request_uri $bowl_fa_global_key {
    default "";
    ~^/bowl-(cap|fantasy|historical)/free-agents "fa";
}
map $request_uri $bowl_team_global_key {
    default "";
    ~^/bowl-(cap|fantasy|historical)/team/ "team";
}
map $request_uri $bowl_expanded_global_key {
    default "";
    ~*^/bowl-(cap|fantasy|historical)/(records|statistics|free-agents).*[?&]expanded=1 "exp";
}

# Shared key: spoofed desktop farms (Catalina + current Chrome/Edge/Firefox).
map $http_user_agent $bowl_scraper_ua_key {
    default "";
    "~*Macintosh; Intel Mac OS X 10[._]15[._]7.*(Chrome/14[89]|Chrome/15[0-2]|Edg/14[89]|Firefox/15[0-2])" scraper;
}

# Keep well below gunicorn concurrency (4 workers x 2 threads).
limit_req_zone $bowl_stats_global_key zone=bowl_stats_global:10m rate=1r/m;
limit_req_zone $bowl_player_global_key zone=bowl_player_global:10m rate=8r/m;
limit_req_zone $bowl_records_global_key zone=bowl_records_global:10m rate=1r/m;
limit_req_zone $bowl_fa_global_key zone=bowl_fa_global:10m rate=1r/m;
limit_req_zone $bowl_team_global_key zone=bowl_team_global:10m rate=6r/m;
limit_req_zone $bowl_expanded_global_key zone=bowl_expanded_global:10m rate=1r/m;
limit_req_zone $bowl_scraper_ua_key zone=bowl_scraper_ua:10m rate=4r/m;
limit_conn_zone $server_name zone=bowl_heavy_conn:10m;
limit_conn_zone $server_name zone=bowl_app_conn:10m;
limit_conn_status 429;

map $http_user_agent $bowl_deny_bot {
    default 0;
    # Catalina cannot run Chrome/Edge 110+ or current Firefox — spoofed scraper farm.
    "~*Macintosh; Intel Mac OS X 10[._]15.*(Chrome/1[1-9][0-9]|Edg/1[1-9][0-9]|Firefox/1[2-9][0-9]|CriOS/1[1-9][0-9])" 1;
    "~*^Mozilla/5.0 \\(Windows NT 10.0; Win64; x64\\) AppleWebKit/537.36$" 1;
    "~*X11; Linux x86_64.*Chrome/15[0-9]" 1;
    ~*PerplexityBot 1;
    ~*Reflectionbot 1;
    ~*meta-externalagent 1;
    ~*AhrefsBot 1;
    ~*SemrushBot 1;
    ~*DotBot 1;
    ~*MJ12bot 1;
    ~*BLEXBot 1;
    ~*GPTBot 1;
    ~*ChatGPT-User 1;
    ~*OAI-SearchBot 1;
    ~*Amazonbot 1;
    ~*Amzn-SearchBot 1;
    ~*Bytespider 1;
    ~*ClaudeBot 1;
    ~*anthropic-ai 1;
    ~*CCBot 1;
    ~*YouBot 1;
    ~*PetalBot 1;
    ~*DataForSeoBot 1;
    ~*ImagesiftBot 1;
    ~*Applebot 1;
    ~*Baiduspider 1;
    ~*ExaUser 1;
    ~*python-httpx 1;
    ~*Scrapy 1;
    ~*aiohttp 1;
}
