# League-prefixed static (files live under app/static/, not under bowl-fantasy/ on disk).
location ~ ^/(?:bowl-historical|bowl-fantasy|bowl-cap|bowl-formula|bowl-demolition)/static/(.+)$ {
    alias /srv/bowl/app/app/static/$1;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}

# Hub / shared static at site root (if used).
location /static/ {
    alias /srv/bowl/app/app/static/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}
